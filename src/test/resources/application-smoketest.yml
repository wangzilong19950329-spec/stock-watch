spring:
  datasource:
    url: jdbc:h2:mem:stockwatchtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-h2.sql

stock-watch:
  prediction:
    evaluation-enabled: false
  monitor:
    enabled: false
    notify-enabled: false
  technical-analysis:
    enabled: false
    v6-mode: runtime
  delivery:
    enabled: false
  price-failure-research:
    enabled: false

ai:
  scheduling:
    enabled: false
