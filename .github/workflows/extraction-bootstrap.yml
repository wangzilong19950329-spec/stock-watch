name: Extraction bootstrap
on:
  push:
    paths:
      - '.github/workflows/extraction-bootstrap.yml'
      - 'tools/extract_stock_watch.py'
      - 'tools/extraction-files/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extraction-bootstrap
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned public source (read only)
        env:
          SOURCE_SHA: eb674b736589fe8ddc716c15af3b400342286f57
        run: |
          set -euo pipefail
          mkdir source
          git -C source init -q
          git -C source remote add origin https://github.com/wangzilong19950329-spec/ai-meeting-room-new.git
          git -C source fetch --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          git -C source archive --format=tar.gz -o "$GITHUB_WORKSPACE/pinned-source.tar.gz" HEAD
          git -C source ls-files > source-files.txt
          printf 'Read-only source commit: %s\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Store pinned source for extraction work
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pinned-extraction-source
          path: |
            pinned-source.tar.gz
            source-files.txt
          retention-days: 3
          if-no-files-found: error
